[package]
name = "rivet-blas-sys"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
authors = ["Ling Yu <lingyu.lynn@outlook.com>"]
description = "The package provides BLAS bindings for Rust."
readme = "README.md"
categories = ["science"]
keywords = ["linear-algebra", "blas"]
homepage = "https://github.com/shaijing/rivet-blas-sys"
repository = "https://github.com/shaijing/rivet-blas-sys"

[features]
default = ["openblas", "ilp64"]

# Integer ABI. Exactly one of these features must be enabled.
ilp64 = []
lp64 = []

# BLAS backend. Exactly one backend must be enabled.
openblas = []
flexiblas = []
intel-mkl = []
netlib = []
accelerate = []

# Link the selected backend statically where supported.
static = []

# Backwards-compatible alias for `system-blas`.
system-blas = []
system = ["system-blas"]

[dependencies]

[target.'cfg(target_os="windows")'.build-dependencies]
vcpkg = "0.2.15"

[build-dependencies]
pkg-config = "0.3.32"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "cblas"
harness = false

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "assets/katex-header.html"]
