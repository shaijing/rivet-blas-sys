[package]
name = "rivet-blas-sys"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
authors = ["Ling Yu <lingyu.lynn@outlook.com>"]
description = "The package provides BLAS bindings for Rust."
readme = "README.md"
categories = ["science"]
keywords = ["linear-algebra", "blas"]
homepage = "https://github.com/shaijing/rivet-blas-sys"
repository = "https://github.com/shaijing/rivet-blas-sys"

[features]
default = ["flexiblas-dynamic-lp64"]

# OpenBLAS
openblas-dynamic-ilp64 = []
openblas-dynamic-lp64 = []
openblas-static-ilp64 = []
openblas-static-lp64 = []

# FlexiBLAS
flexiblas-dynamic-ilp64 = []
flexiblas-dynamic-lp64 = []
flexiblas-static-ilp64 = []
flexiblas-static-lp64 = []

# Intel oneMKL
mkl-dynamic-ilp64-gomp = []
mkl-dynamic-ilp64-iomp = []
mkl-dynamic-ilp64-seq = []
mkl-dynamic-ilp64-tbb = []
mkl-dynamic-lp64-gomp = []
mkl-dynamic-lp64-iomp = []
mkl-dynamic-lp64-seq = []
mkl-dynamic-lp64-tbb = []
mkl-sdl = []
mkl-static-ilp64-gomp = []
mkl-static-ilp64-iomp = []
mkl-static-ilp64-seq = []
mkl-static-ilp64-tbb = []
mkl-static-lp64-gomp = []
mkl-static-lp64-iomp = []
mkl-static-lp64-seq = []
mkl-static-lp64-tbb = []

# Netlib reference BLAS
netlib-dynamic-lp64 = []
netlib-static-lp64 = []

# Apple's Accelerate framework is a complete LP64 configuration.
accelerate = []

[dependencies]

[target.'cfg(target_os="windows")'.build-dependencies]
vcpkg = "0.2.15"

[build-dependencies]
pkg-config = "0.3.32"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "cblas"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
    "--html-in-header",
    "assets/katex-header.html",
]
